<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG에너지솔루션 배터리 원가 분석 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-value {
            color: #333;
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-value.negative {
            color: #e74c3c;
        }
        
        .stat-value.positive {
            color: #27ae60;
        }
        
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .action-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s;
        }
        
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .action-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .action-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .action-desc {
            color: #666;
            margin-bottom: 20px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .variance-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        
        .variance-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .variance-item:last-child {
            border-bottom: none;
        }
        
        .severity-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .severity-high {
            background: #ffe0e0;
            color: #e74c3c;
        }
        
        .severity-medium {
            background: #fff5e0;
            color: #f39c12;
        }
        
        .severity-low {
            background: #e0f5ff;
            color: #3498db;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔋 LG에너지솔루션 배터리 원가 분석</h1>
            <p class="subtitle">Neo4j 기반 원가차이 분석 시스템</p>
        </header>
        
        <div id="loading" class="loading">
            데이터를 불러오는 중...
        </div>
        
        <div id="dashboard" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">📦 전체 생산오더</div>
                    <div class="stat-value" id="totalOrders">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🔍 원가차이 건수</div>
                    <div class="stat-value" id="totalVariances">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">💰 총 원가차이</div>
                    <div class="stat-value negative" id="totalVarianceAmount">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📊 평균 차이율</div>
                    <div class="stat-value" id="avgVariancePercent">-</div>
                </div>
            </div>
            
            <div class="variance-list">
                <h2 style="margin-bottom: 20px;">원가요소별 차이 분석</h2>
                <div id="varianceByType"></div>
            </div>
            
            <div class="actions">
                <div class="action-card">
                    <div class="action-icon">🌐</div>
                    <div class="action-title">그래프 네트워크</div>
                    <p class="action-desc">Neo4j 그래프로 원가 흐름 시각화</p>
                    <a href="variance_graph_dashboard_v3.html" class="btn">그래프 보기</a>
                </div>
                
                <div class="action-card">
                    <div class="action-icon">📊</div>
                    <div class="action-title">상세 대시보드</div>
                    <p class="action-desc">차트와 통계로 원가 분석</p>
                    <a href="dashboard.html" class="btn">대시보드 열기</a>
                </div>
                
                <div class="action-card">
                    <div class="action-icon">⚖️</div>
                    <div class="action-title">비교 분석</div>
                    <p class="action-desc">생산오더 간 비교 분석</p>
                    <a href="comparison.html" class="btn">비교하기</a>
                </div>
                
                <div class="action-card">
                    <div class="action-icon">🔗</div>
                    <div class="action-title">Neo4j Browser</div>
                    <p class="action-desc">직접 쿼리 실행하기</p>
                    <a href="https://console.neo4j.io" target="_blank" class="btn">Neo4j 열기</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // API에서 데이터 가져오기
        async function loadData() {
            try {
                // 요약 데이터
                const summaryRes = await fetch('/api/summary');
                const summary = await summaryRes.json();
                
                // 전체 통계
                const overviewRes = await fetch('/api/overview');
                const overview = await overviewRes.json();
                
                // 데이터 표시
                document.getElementById('totalOrders').textContent = overview.production_orders || '-';
                document.getElementById('totalVariances').textContent = overview.variances || '-';
                
                // 총 원가차이 계산
                let totalVariance = 0;
                summary.forEach(item => {
                    totalVariance += item.total || 0;
                });
                document.getElementById('totalVarianceAmount').textContent = 
                    (totalVariance / 1000000000).toFixed(1) + '억원';
                
                // 평균 차이율 (임시)
                document.getElementById('avgVariancePercent').textContent = '16.4%';
                
                // 원가요소별 차이
                const varianceByTypeDiv = document.getElementById('varianceByType');
                const elementMap = {
                    'MATERIAL': '재료비',
                    'LABOR': '노무비',
                    'OVERHEAD': '경비'
                };
                const typeMap = {
                    'PRICE': '단가차이',
                    'QUANTITY': '수량차이',
                    'VOLUME': '조업도차이',
                    'RATE': '임률차이',
                    'EFFICIENCY': '효율차이',
                    'SPENDING': '지출차이'
                };
                
                summary.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'variance-item';
                    
                    const severity = item.count > 80 ? 'high' : item.count > 50 ? 'medium' : 'low';
                    
                    itemDiv.innerHTML = `
                        <div>
                            <strong>${elementMap[item.element] || item.element}</strong> - 
                            ${typeMap[item.type] || item.type}
                        </div>
                        <div>
                            <span class="severity-badge severity-${severity}">${item.count}건</span>
                            <strong style="margin-left: 15px; color: #e74c3c;">
                                ${(item.total / 1000000).toFixed(0)}백만원
                            </strong>
                        </div>
                    `;
                    
                    varianceByTypeDiv.appendChild(itemDiv);
                });
                
                // 로딩 숨기고 대시보드 표시
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
            } catch (error) {
                console.error('데이터 로딩 실패:', error);
                document.getElementById('loading').innerHTML = 
                    '<p style="color: #e74c3c;">데이터를 불러오는데 실패했습니다.<br>서버가 실행 중인지 확인해주세요.</p>';
            }
        }
        
        // 페이지 로드 시 데이터 가져오기
        loadData();
    </script>
</body>
</html>
