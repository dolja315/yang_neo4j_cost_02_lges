    <script>
        const API_BASE = '/api';
        let network;
        let nodes, edges;
        let currentFilters = { product: '', material: '', workcenter: '', period: '' };
        let expandedCategories = new Set();
        let startNodeType = 'product'; // 'order', 'product', 'material', 'workcenter'
        let selectedItem = null; // 현재 선택된 항목
        
        // 노드 타입 전환
        function switchNodeType(type) {
            startNodeType = type;
            
            // 버튼 활성화 상태 변경
            document.querySelectorAll('.node-type-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) {
                    btn.classList.add('active');
                }
            });
            
            // 컨테이너 표시/숨김
            document.getElementById('productButtonsContainer').style.display = (type === 'product') ? 'block' : 'none';
            document.getElementById('materialButtonsContainer').style.display = (type === 'material') ? 'block' : 'none';
            document.getElementById('workcenterButtonsContainer').style.display = (type === 'workcenter') ? 'block' : 'none';
            
            // 펼쳐진 카테고리 새로고침
            for (const category of expandedCategories) {
                loadCategoryItems(category);
            }
        }
        
        // 항목 선택 및 그래프 로드
        async function selectItem(type, value) {
            console.log('=== 항목 선택됨 ===');
            console.log('타입:', type);
            console.log('값:', value);
            
            selectedItem = value;
            startNodeType = type;
            // 선택된 제품이면 요약 금액 필터 반영
            if (type === 'product') {
                await loadSummary({ product: value });
            }
            
            // 해당 컨테이너의 모든 버튼에서 선택 해제
            const containerMap = {
                'product': 'productButtons',
                'material': 'materialButtons',
                'workcenter': 'workcenterButtons'
            };
            
            const container = document.getElementById(containerMap[type]);
            container.querySelectorAll('.item-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent === value) {
                    btn.classList.add('selected');
                    console.log('버튼 선택 표시:', btn.textContent);
                }
            });
            
            // 그래프 로드 - 즉시 실행!
            console.log('그래프 로드 시작...');
            try {
                await loadOrderGraph(value);
                console.log('그래프 로드 완료!');
            } catch (error) {
                console.error('그래프 로드 실패:', error);
                alert('그래프 로드 실패: ' + error.message);
            }
        }
        
        // 초기화 (실패해도 로딩 표시 해제)
        async function init() {
            const loadingEl = document.getElementById('loading');
            try {
                await checkConnection();
                await loadFilters();
                await loadSummary();
                initGraph();
            } catch (e) {
                console.error('초기화 오류:', e);
            } finally {
                if (loadingEl) loadingEl.style.display = 'none';
            }
        }
        
        
        // API 연결 확인 (타임아웃으로 "확인중..." 무한 대기 방지)
        async function checkConnection() {
            const badge = document.getElementById('statusBadge');
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch(`${API_BASE}/overview`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.ok) {
                    if (badge) { badge.textContent = '✓ 연결됨'; badge.className = 'status connected'; }
                } else {
                    if (badge) { badge.textContent = '✗ 연결 끊김'; badge.className = 'status disconnected'; }
                }
            } catch (error) {
                if (badge) { badge.textContent = '✗ 연결 끊김'; badge.className = 'status disconnected'; }
                console.error('API 연결 실패:', error);
            }
        }
        
        // 필터 옵션 로드 (실패해도 "로딩중" 제거)
        function setNoData(containerId, msg) {
            const el = document.getElementById(containerId);
            if (el) el.innerHTML = '<div style="text-align: center; width: 100%; padding: 20px; color: #999;">' + (msg || '데이터 없음') + '</div>';
        }
        async function loadFilters() {
            const productContainer = document.getElementById('productButtons');
            const workcenterContainer = document.getElementById('workcenterButtons');
            const materialContainer = document.getElementById('materialButtons');
            try {
                const response = await fetch(`${API_BASE}/filters`);
                const data = await response.json().catch(() => ({}));
                const products = Array.isArray(data.products) ? data.products : [];
                const workCenters = Array.isArray(data.work_centers) ? data.work_centers : [];
                const materials = Array.isArray(data.materials) ? data.materials : [];
                if (productContainer) {
                    productContainer.innerHTML = '';
                    if (products.length > 0) {
                        products.forEach(p => {
                            const btn = document.createElement('button');
                            btn.className = 'item-btn';
                            btn.textContent = p;
                            btn.onclick = () => selectItem('product', p);
                            productContainer.appendChild(btn);
                        });
                    } else {
                        setNoData('productButtons', '제품 데이터 없음');
                    }
                }
                if (workcenterContainer) {
                    workcenterContainer.innerHTML = '';
                    if (workCenters.length > 0) {
                        workCenters.forEach(wc => {
                            const btn = document.createElement('button');
                            btn.className = 'item-btn';
                            btn.textContent = wc;
                            btn.onclick = () => selectItem('workcenter', wc);
                            workcenterContainer.appendChild(btn);
                        });
                    } else {
                        setNoData('workcenterButtons', '공정 데이터 없음');
                    }
                }
                if (materialContainer) {
                    materialContainer.innerHTML = '';
                    if (materials.length > 0) {
                        materials.slice(0, 30).forEach(m => {
                            const btn = document.createElement('button');
                            btn.className = 'item-btn';
                            btn.textContent = (m && m.id) ? m.id : m;
                            btn.title = (m && m.name) ? m.name : '';
                            btn.onclick = () => selectItem('material', (m && m.id) ? m.id : m);
                            materialContainer.appendChild(btn);
                        });
                    } else {
                        setNoData('materialButtons', '원자재 데이터 없음');
                    }
                }
            } catch (error) {
                console.error('필터 로드 실패:', error);
                setNoData('productButtons', '로드 실패');
                setNoData('workcenterButtons', '로드 실패');
                setNoData('materialButtons', '로드 실패');
            }
        }
        
        // 요약 정보 로드 (실패해도 "-" 대신 "₩0" 등으로 표시)
        function setSummaryDefaults() {
            const totalAmount = document.getElementById('totalAmount');
            const totalCount = document.getElementById('totalCount');
            const amountQuantity = document.getElementById('amountQuantity');
            const amountPrice = document.getElementById('amountPrice');
            const amountProduction = document.getElementById('amountProduction');
            if (totalAmount) totalAmount.textContent = '₩0';
            if (totalCount) totalCount.textContent = '0건';
            if (amountQuantity) amountQuantity.textContent = '₩0';
            if (amountPrice) amountPrice.textContent = '₩0';
            if (amountProduction) amountProduction.textContent = '₩0';
        }
        async function loadSummary(filters = {}) {
            try {
                const response = await fetch(`${API_BASE}/filtered_summary`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(filters)
                });
                const data = await response.json().catch(() => null);
                if (!data) { setSummaryDefaults(); return; }
                const totalV = data.total_variance != null ? data.total_variance : 0;
                const totalC = data.total_count != null ? data.total_count : 0;
                const totalAmount = document.getElementById('totalAmount');
                const totalCount = document.getElementById('totalCount');
                if (totalAmount) totalAmount.textContent = formatCurrency(totalV);
                if (totalCount) totalCount.textContent = totalC + '건';
                const amounts = { MATERIAL: 0, LABOR: 0, OVERHEAD: 0 };
                (Array.isArray(data.by_type) ? data.by_type : []).forEach(item => {
                    const element = item && item.cost_element;
                    if (element && amounts.hasOwnProperty(element)) {
                        amounts[element] += parseFloat(item.total_variance || 0);
                    }
                });
                const amountQuantity = document.getElementById('amountQuantity');
                const amountPrice = document.getElementById('amountPrice');
                const amountProduction = document.getElementById('amountProduction');
                if (amountQuantity) amountQuantity.textContent = formatCurrency(amounts.MATERIAL);
                if (amountPrice) amountPrice.textContent = formatCurrency(amounts.LABOR);
                if (amountProduction) amountProduction.textContent = formatCurrency(amounts.OVERHEAD);
            } catch (error) {
                console.error('요약 로드 실패:', error);
                setSummaryDefaults();
            }
        }
        
        // 필터 적용 (목록만 필터링)
        async function applyFilters() {
            currentFilters = {
                month: document.getElementById('filterPeriod').value
            };
            
            await loadSummary(currentFilters);
            
            // 펼쳐진 카테고리 새로고침
            for (const category of expandedCategories) {
                await loadCategoryItems(category);
            }
        }
        
        // 카테고리 토글
        async function toggleCategory(category) {
            const items = document.getElementById(`items${capitalize(category)}`);
            const icon = document.getElementById(`icon${capitalize(category)}`);
            
            if (expandedCategories.has(category)) {
                // 접기
                items.classList.remove('show');
                icon.classList.remove('expanded');
                expandedCategories.delete(category);
            } else {
                // 펼치기
                items.classList.add('show');
                icon.classList.add('expanded');
                expandedCategories.add(category);
                await loadCategoryItems(category);
            }
        }
        
        // 카테고리 항목 로드
        async function loadCategoryItems(category) {
            const elementMap = {
                'quantity': 'MATERIAL',
                'price': 'LABOR',
                'production': 'OVERHEAD'
            };
            
            const costElement = elementMap[category];
            if (!costElement) {
                console.error('Unknown category:', category);
                return;
            }
            
            const container = document.getElementById(`items${capitalize(category)}`);
            container.innerHTML = '<div style="padding:10px; text-align:center; color:#7f8c8d; font-size:11px;">로딩중...</div>';
            
            try {
                // cost_element로 필터링된 데이터 가져오기
                const response = await fetch(`${API_BASE}/variances/by-element?element=${costElement}`);
                const allOrders = await response.json();
                
                // 정렬 (절대값 기준)
                allOrders.sort((a, b) => Math.abs(b.total_variance) - Math.abs(a.total_variance));
                
                // HTML 생성 - 항상 생산오더별로 표시
                if (allOrders.length === 0) {
                    container.innerHTML = '<div style="padding:10px; text-align:center; color:#7f8c8d; font-size:11px;">데이터 없음</div>';
                } else {
                    // 생산오더별로 표시 (그룹화하지 않음)
                    container.innerHTML = allOrders.map(order => `
                        <div class="order-item" onclick="loadOrderGraphAsOrder('${order.order_no}', event)">
                            <div class="order-no">${order.order_no}</div>
                            <div class="order-detail">제품: ${order.product || 'N/A'} | 공정: ${order.work_center || 'N/A'}</div>
                            <div class="order-amount">${formatCurrency(order.total_variance)}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('항목 로드 실패:', error);
                container.innerHTML = '<div style="padding:10px; text-align:center; color:#e74c3c; font-size:11px;">로드 실패</div>';
            }
        }
        
        // 노드 그래프 로드 (다양한 타입 지원)
        async function loadOrderGraph(identifier, evt) {
            console.log('=== loadOrderGraph 호출 ===');
            console.log('identifier:', identifier);
            console.log('startNodeType:', startNodeType);
            
            document.getElementById('loading').style.display = 'block';
            
            // 타이틀 설정
            const titleMap = {
                'order': '생산오더',
                'product': '제품',
                'material': '원자재',
                'workcenter': '공정'
            };
            document.getElementById('graphTitle').textContent = `${titleMap[startNodeType]}: ${identifier}`;
            
            // 선택 표시
            document.querySelectorAll('.order-item').forEach(item => {
                item.classList.remove('selected');
            });
            if (evt) {
                evt.target.closest('.order-item').classList.add('selected');
            }
            
            try {
                let response;
                const endpointMap = {
                    'order': `production-order/${encodeURIComponent(identifier)}`,
                    'product': `product/${encodeURIComponent(identifier)}`,
                    'material': `material/${encodeURIComponent(identifier)}`,
                    'workcenter': `workcenter/${encodeURIComponent(identifier)}`
                };
                
                const endpoint = `${API_BASE}/${endpointMap[startNodeType]}/graph`;
                console.log('API 호출:', endpoint);
                
                response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                console.log('Graph data received:', data);
                updateGraph(data.nodes, data.edges);
                
                // 초기 상태 저장
                saveInitialState(data.nodes, data.edges);
            } catch (error) {
                console.error('그래프 로드 실패:', error);
                alert('그래프를 로드할 수 없습니다: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // 생산오더로 그래프 로드 (아래 목록에서 클릭 시)
        async function loadOrderGraphAsOrder(orderNo, evt) {
            console.log('생산오더 클릭:', orderNo);
            // 임시로 startNodeType을 order로 변경
            const originalType = startNodeType;
            startNodeType = 'order';
            await loadOrderGraph(orderNo, evt);
            startNodeType = originalType; // 원래 타입으로 복원
        }
        
        // 그래프 초기화
        function initGraph() {
            console.log('Initializing graph...');
            const container = document.getElementById('mynetwork');
            
            if (!container) {
                console.error('Graph container not found!');
                return;
            }
            
            if (typeof vis === 'undefined') {
                console.error('vis.js library not loaded!');
                return;
            }
            
            nodes = new vis.DataSet([]);
            edges = new vis.DataSet([]);
            
            const data = { nodes, edges };
            const options = {
                nodes: {
                    shape: 'dot',
                    font: {
                        size: 12,
                        face: 'Segoe UI'
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 2,
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                    smooth: { type: 'continuous' },
                    font: { size: 10, align: 'middle' }
                },
                physics: {
                    enabled: true,
                    stabilization: { 
                        enabled: true,
                        iterations: 120,
                        updateInterval: 50,
                        onlyDynamicEdges: false,
                        fit: true
                    },
                    barnesHut: {
                        gravitationalConstant: -1200,
                        centralGravity: 0.1,
                        springLength: 180,
                        springConstant: 0.03,
                        damping: 0.8,
                        avoidOverlap: 0.5
                    },
                    maxVelocity: 30,
                    minVelocity: 0.1,
                    solver: 'barnesHut',
                    timestep: 0.5
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };
            
            network = new vis.Network(container, data, options);
            console.log('Network object created:', network);
            applyPhysicsStabilization(120);
            
            // 이벤트 리스너
            network.on('doubleClick', handleNodeDoubleClick);
            network.on('click', handleNodeClick);
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
            console.log('Graph initialized successfully');
        }
        
        // 그래프 업데이트
        const TYPE_GLUE_NODE_LIMIT = 80;
        const TYPE_GLUE_MAX_PER_TYPE = 20;
        
        function applyPhysicsStabilization(iterations) {
            if (!network) return;
            network.setOptions({
                physics: { enabled: true, stabilization: { enabled: true, iterations } }
            });
            network.stabilize(iterations);
        }

        function addTypeGlueEdges() {
            if (!nodes || !edges) return;
            const allNodes = nodes.get().filter(n => !n.hidden);
            if (allNodes.length > TYPE_GLUE_NODE_LIMIT) return;
            const byType = new Map();
            allNodes.forEach(node => {
                const type = node.type || 'Unknown';
                if (!byType.has(type)) byType.set(type, []);
                byType.get(type).push(node.id);
            });
            byType.forEach((ids, type) => {
                if (ids.length < 2) return;
                const limited = ids.slice(0, TYPE_GLUE_MAX_PER_TYPE);
                for (let i = 1; i < limited.length; i++) {
                    const from = limited[i - 1];
                    const to = limited[i];
                    const glueId = `glue_${type}_${from}_${to}`;
                    if (edges.get(glueId)) continue;
                    edges.add({
                        id: glueId,
                        from,
                        to,
                        hidden: true,
                        physics: true,
                        color: 'rgba(0,0,0,0)',
                        width: 0.1,
                        length: 140
                    });
                }
            });
        }
        
        function updateGraph(newNodes, newEdges) {
            console.log('Updating graph with nodes:', newNodes.length, 'edges:', newEdges.length);
            
            // 너무 많은 노드 경고
            if (newNodes.length > 50) {
                console.warn('⚠️ 노드가 많습니다 (' + newNodes.length + '개). 성능 저하 가능.');
                document.getElementById('graphTitle').textContent += ' (노드 ' + newNodes.length + '개)';
            }
            
            const container = document.getElementById('mynetwork');
            console.log('Container size:', {
                width: container.offsetWidth,
                height: container.offsetHeight,
                display: window.getComputedStyle(container).display
            });
            
            nodes.clear();
            edges.clear();
            
            nodes.add(newNodes);
            edges.add(newEdges);
            lastSelectedNodeId = null;
            addTypeGlueEdges();
            
            console.log('Nodes added to dataset:', nodes.length);
            console.log('Edges added to dataset:', edges.length);
            
            applyPhysicsStabilization(140);
            
            // 그래프를 화면에 맞추고 약간 줌아웃
            setTimeout(() => {
                network.fit({
                    animation: {
                        duration: 1000,
                        easingFunction: 'easeInOutQuad'
                    }
                });
                console.log('Network.fit() called, scale:', network.getScale());
                
                // 약간 줌아웃하여 전체가 보이도록
                setTimeout(() => {
                    const scale = network.getScale();
                    network.moveTo({
                        scale: scale * 0.8,
                        animation: {
                            duration: 500,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                    console.log('Zoomed out to scale:', scale * 0.8);
                }, 1000);
            }, 100);
            
            console.log('Graph updated successfully');
        }
        
        // 노드 더블클릭 - 확장
        async function handleNodeDoubleClick(params) {
            if (params.nodes.length === 0) return;
            
            const nodeId = params.nodes[0];
            lastSelectedNodeId = nodeId;
            if (nodeId.startsWith('product_') || nodeId.startsWith('material_') || nodeId.startsWith('workcenter_')) {
                document.getElementById('graphInfo').textContent = '확장할 노드가 없습니다';
                return;
            }
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(`${API_BASE}/node/${encodeURIComponent(nodeId)}/expand`);
                if (!response.ok) {
                    throw new Error('expand failed: ' + response.status);
                }
                const data = await response.json();
                if (!data || !data.nodes || data.nodes.length === 0) {
                    document.getElementById('graphInfo').textContent = '확장할 노드가 없습니다';
                    return;
                }
                
                // 기존 노드/엣지에 추가
                data.nodes.forEach(node => {
                    if (!nodes.get(node.id)) {
                        nodes.add(node);
                    }
                });
                
                data.edges.forEach(edge => {
                    if (!edges.get(edge.id)) {
                        edges.add(edge);
                    }
                });
                addTypeGlueEdges();
                
                document.getElementById('graphInfo').textContent = 
                    `${data.nodes.length}개 노드 추가됨`;
                
                // 확장 후 잠깐만 물리 엔진 켜서 겹침 해소
                applyPhysicsStabilization(120);
                network.fit({ animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
                    
            } catch (error) {
                console.error('노드 확장 실패:', error);
                document.getElementById('graphInfo').textContent = '노드 확장 실패';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // 노드 클릭 - 콘솔에 정보 출력
        function handleNodeClick(params) {
            if (params.nodes.length === 0) {
                return;
            }
            
            const nodeId = params.nodes[0];
            const node = nodes.get(nodeId);
            
            if (!node) return;
            lastSelectedNodeId = nodeId;
            
            // 콘솔에만 출력
            console.log(`${node.type}: ${node.label}`, node.properties);
        }
        
        // 초기화 버튼 - 처음 상태로
        let initialGraphData = null;
        let lastSelectedNodeId = null;
        
        function saveInitialState(graphNodes, graphEdges) {
            initialGraphData = {
                nodes: JSON.parse(JSON.stringify(graphNodes)),
                edges: JSON.parse(JSON.stringify(graphEdges))
            };
        }
        
        function resetToInitial() {
            if (!initialGraphData) {
                alert('초기 상태가 저장되지 않았습니다.');
                return;
            }
            
            nodes.clear();
            edges.clear();
            nodes.add(initialGraphData.nodes);
            edges.add(initialGraphData.edges);
            addTypeGlueEdges();
            lastSelectedNodeId = null;
            
            applyPhysicsStabilization(140);
            network.fit();
            document.getElementById('graphInfo').textContent = '그래프가 초기화되었습니다';
        }
        
        // 포커스 버튼 - 선택한 노드만 보기
        function focusSelection() {
            const selected = network.getSelectedNodes();
            
            let selectedNodeId = selected[0];
            if (!selectedNodeId && lastSelectedNodeId && nodes.get(lastSelectedNodeId)) {
                selectedNodeId = lastSelectedNodeId;
                network.selectNodes([selectedNodeId]);
            }
            if (!selectedNodeId) {
                alert('노드를 먼저 선택해주세요 (클릭)');
                return;
            }
            const selectedNode = nodes.get(selectedNodeId);
            
            // 선택한 노드와 직접 연결된 노드 찾기
            const connectedEdges = edges.get({
                filter: edge => edge.from === selectedNodeId || edge.to === selectedNodeId
            });
            
            const connectedNodeIds = new Set([selectedNodeId]);
            connectedEdges.forEach(edge => {
                connectedNodeIds.add(edge.from);
                connectedNodeIds.add(edge.to);
            });
            
            // 연결된 노드만 남기고 나머지 숨기기
            const allNodes = nodes.get();
            allNodes.forEach(node => {
                if (connectedNodeIds.has(node.id)) {
                    nodes.update({ id: node.id, hidden: false });
                } else {
                    nodes.update({ id: node.id, hidden: true });
                }
            });
            
            const allEdges = edges.get();
            allEdges.forEach(edge => {
                if (connectedNodeIds.has(edge.from) && connectedNodeIds.has(edge.to)) {
                    edges.update({ id: edge.id, hidden: false });
                } else {
                    edges.update({ id: edge.id, hidden: true });
                }
            });
            
            applyPhysicsStabilization(120);
            setTimeout(() => {
                network.fit();
            }, 100);
            
            document.getElementById('graphInfo').textContent = `${selectedNode.label} 중심으로 포커스`;
        }
        
        // 유틸리티
        function formatCurrency(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return '-';
            return new Intl.NumberFormat('ko-KR', {
                style: 'currency',
                currency: 'KRW',
                minimumFractionDigits: 0
            }).format(num);
        }
        
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
        
        // 시작
        init();
    </script>
</body>
</html>
